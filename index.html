<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reborn Tech Global | Technology services</title>
  <meta name="description" content="Reborn Tech Global offers AI automation, website and app development, software and hardware support, and crypto and gift card exchange.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="logo.png">

  <style>
    /* ==========================================================
       DESIGN TOKENS
       Dark base, white text, red used only for buttons,
       active indicators and hover lines.
       ========================================================== */
    :root {
      --bg: #0b0b0d;
      --bg-2: #131317;
      --line: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --soft: #e6e6ea;
      --muted: #b9b9c2;
      --red: #d90429;
      --red-dark: #b30322;
      --error: #ff7b8d;
      --header-h: 64px;
      --wrap: 1120px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.6 var(--font);
    }
    img, video, svg { display: block; max-width: 100%; }
    svg { fill: currentColor; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    [id] { scroll-margin-top: calc(var(--header-h) + 12px); }
    :focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; left: 12px; top: -60px; z-index: 200;
      padding: 10px 14px; border-radius: 6px; background: #ffffff; color: #000000;
      font-weight: 600; text-decoration: none;
    }
    .skip-link:focus { top: 12px; }

    .wrap { width: min(100% - 40px, var(--wrap)); margin-inline: auto; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 48px; padding: 12px 24px;
      border: 2px solid transparent; border-radius: 8px;
      background: transparent; color: #ffffff;
      font: 600 1rem/1.2 var(--font); text-decoration: none; cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .btn svg { width: 22px; height: 22px; }
    .btn-red { background: var(--red); }
    .btn-red:hover { background: var(--red-dark); }
    .btn-line { border-color: rgba(255, 255, 255, 0.55); }
    .btn-line:hover { border-color: var(--red); }
    .btn-lg { min-height: 56px; padding: 16px 32px; font-size: 1.125rem; }
    .btn[disabled] { opacity: 0.6; cursor: not-allowed; }

    /* ==========================================================
       SHARED HEADER
       ========================================================== */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 11, 13, 0.94);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .header-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: var(--header-h);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; text-decoration: none;
    }
    .brand img { height: 40px; width: auto; } /* Logo stays still: no rotation, no animation */

    .nav-toggle {
      display: grid; place-items: center; width: 44px; height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px;
      background: transparent; color: #ffffff; cursor: pointer;
    }
    .nav-toggle:hover { border-color: var(--red); }
    .nav-toggle svg { width: 24px; height: 24px; }
    .nav-toggle .icon-close { display: none; }
    .nav-toggle[aria-expanded="true"] .icon-open { display: none; }
    .nav-toggle[aria-expanded="true"] .icon-close { display: block; }

    /* Phone menu: a panel under the header */
    .nav {
      position: absolute; left: 0; right: 0; top: 100%;
      display: none; background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .nav.is-open { display: block; }
    .nav ul { list-style: none; margin: 0; padding: 8px 20px 16px; }
    .nav a {
      position: relative; display: block; width: fit-content;
      padding: 14px 0; font-weight: 500; text-decoration: none;
    }
    .nav a::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 8px; height: 2px;
      background: var(--red); transform: scaleX(0); transform-origin: left;
      transition: transform 0.2s;
    }
    .nav a:hover::after, .nav a[aria-current="page"]::after { transform: scaleX(1); }

    .header-wa { display: none; } /* Shown on large screens only */

    /* Floating WhatsApp button: phones only */
    .wa-float {
      position: fixed; right: 16px; bottom: 16px; z-index: 90;
      display: grid; place-items: center; width: 56px; height: 56px;
      border-radius: 50%; background: var(--red); color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .wa-float:hover { background: var(--red-dark); }
    .wa-float svg { width: 28px; height: 28px; }

    /* ==========================================================
       HERO: video with the service slider
       Phone: video on top, slider directly under it.
       Large screen: video fills the hero, slider sits over it.
       ========================================================== */
    .hero { position: relative; background: #000000; }
    .hero-media {
      position: relative; height: clamp(220px, 58vw, 380px);
      overflow: hidden; background: #000000;
    }
    .hero-media video { width: 100%; height: 100%; object-fit: cover; }
    .hero-shade {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom, rgba(11, 11, 13, 0) 55%, rgba(11, 11, 13, 0.85) 100%);
    }
    .media-controls { position: absolute; right: 12px; bottom: 12px; z-index: 2; display: flex; gap: 8px; }
    .media-btn {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 999px;
      background: rgba(0, 0, 0, 0.65); color: #ffffff;
      font: 600 0.875rem/1 var(--font); cursor: pointer;
    }
    .media-btn:hover { border-color: var(--red); }
    .media-btn svg { width: 18px; height: 18px; }

    .hero-body { position: relative; padding: 28px 0 40px; background: var(--bg); }
    .hero-inner { max-width: 640px; }

    .slides { display: grid; }
    .slide {
      grid-area: 1 / 1;
      opacity: 0; visibility: hidden;
      transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    }
    .slide.is-active { opacity: 1; visibility: visible; transition: opacity 0.4s ease; }
    .slide h2 {
      margin: 0 0 12px; font-size: clamp(1.9rem, 6vw, 3.25rem);
      font-weight: 800; line-height: 1.08; letter-spacing: -0.02em;
    }
    .slide p { margin: 0 0 24px; max-width: 32ch; color: var(--soft); font-size: clamp(1.05rem, 2.6vw, 1.3rem); }

    .slider-nav { display: flex; align-items: center; gap: 12px; margin-top: 28px; }
    .arrow {
      display: grid; place-items: center; width: 44px; height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 50%;
      background: transparent; color: #ffffff; cursor: pointer;
    }
    .arrow:hover { border-color: var(--red); }
    .arrow svg { width: 22px; height: 22px; }
    .dots { display: flex; gap: 2px; }
    .dot {
      display: grid; place-items: center; width: 32px; height: 44px;
      padding: 0; border: 0; background: none; cursor: pointer;
    }
    .dot::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.45); transition: background-color 0.2s;
    }
    .dot[aria-current="true"]::before { background: var(--red); }

    .hero-cta { margin-top: 28px; }

    /* ==========================================================
       SECTIONS
       ========================================================== */
    .section { padding: 56px 0; border-top: 1px solid var(--line); }
    .section h2 {
      margin: 0 0 20px; font-size: clamp(1.6rem, 4vw, 2.25rem);
      line-height: 1.15; letter-spacing: -0.015em;
    }
    .section-note { margin: -8px 0 28px; max-width: 52ch; color: var(--muted); }

    /* Who We Are */
    .about-grid { display: grid; gap: 4px; }
    .about-grid h2 { margin-bottom: 12px; }
    .about-grid p { margin: 0; max-width: 60ch; color: var(--soft); font-size: 1.0625rem; }

    /* How It Works: a real sequence, so numbers are used */
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
    .steps li {
      display: flex; align-items: flex-start; gap: 16px; padding: 20px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2);
    }
    .step-num {
      flex: none; display: grid; place-items: center; width: 36px; height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 50%; font-weight: 700;
    }
    .steps p { margin: 4px 0 0; font-size: 1.0625rem; }

    /* Our Work */
    .work-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .work-card {
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2);
    }
    .work-card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #000000; }
    .work-body { display: flex; flex: 1; flex-direction: column; gap: 10px; padding: 20px; }
    .work-body h3 { margin: 0; font-size: 1.2rem; }
    .work-body p { flex: 1; margin: 0; color: var(--muted); }
    .work-body .btn { align-self: flex-start; margin-top: 8px; }

    /* Request form */
    .form-card {
      max-width: 640px; padding: 24px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2);
    }
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 6px; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%; min-height: 48px; padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 8px;
      background: var(--bg); color: #ffffff; font: inherit; color-scheme: dark;
    }
    .field textarea { min-height: 120px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #ffffff; }
    .field [aria-invalid="true"] { border-color: var(--error); }
    .field.check { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .field.check input { flex: none; width: 22px; min-height: 0; height: 22px; margin: 2px 0 0; accent-color: var(--red); }
    .field.check label { flex: 1; margin: 0; font-weight: 400; }
    .field.check label a { text-decoration: underline; text-underline-offset: 3px; }
    .error { display: block; margin-top: 6px; color: var(--error); font-size: 0.9rem; }
    .field.check .error { flex-basis: 100%; margin: 0 0 0 34px; }
    .form-status { margin: 16px 0 0; color: var(--soft); }
    .form-status a { text-decoration: underline; text-underline-offset: 3px; }

    /* ==========================================================
       SHARED FOOTER
       The only place for contact details and social links.
       ========================================================== */
    .site-footer { padding: 56px 0 96px; background: #000000; border-top: 1px solid var(--line); }
    .footer-grid { display: grid; gap: 36px; }
    .footer-brand .brand { margin-bottom: 12px; }
    .footer-brand p { margin: 0; max-width: 32ch; color: var(--muted); }
    .footer-links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .footer-contact { display: grid; gap: 10px; font-style: normal; }
    .footer-contact .label { color: var(--muted); margin-right: 6px; }
    .footer-links a, .footer-contact a {
      text-decoration: none; padding-bottom: 2px;
      background: linear-gradient(var(--red), var(--red)) 0 100% / 0 2px no-repeat;
      transition: background-size 0.2s;
    }
    .footer-links a:hover, .footer-contact a:hover { background-size: 100% 2px; }
    .footer-bottom {
      display: flex; flex-direction: column; gap: 16px;
      margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line);
    }
    .socials { list-style: none; display: flex; gap: 12px; margin: 0; padding: 0; }
    .socials a {
      display: grid; place-items: center; width: 44px; height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
    }
    .socials a:hover { border-color: var(--red); }
    .socials svg { width: 20px; height: 20px; }
    .copyright { margin: 0; color: var(--muted); font-size: 0.9rem; }

    /* ==========================================================
       LARGE SCREENS
       ========================================================== */
    @media (min-width: 900px) {
      :root { --header-h: 72px; }

      .nav-toggle { display: none; }
      .nav {
        position: static; display: block; margin-left: auto;
        background: none; border: 0;
      }
      .nav ul { display: flex; gap: 28px; padding: 0; }
      .nav a { padding: 8px 0; }
      .nav a::after { bottom: 0; }
      .header-wa { display: inline-flex; }
      .wa-float { display: none; }

      .hero {
        display: flex; align-items: center;
        min-height: clamp(560px, calc(100vh - var(--header-h)), 820px);
      }
      .hero-media { position: absolute; inset: 0; height: auto; }
      .hero-shade {
        background:
          linear-gradient(90deg, rgba(11, 11, 13, 0.92) 0%, rgba(11, 11, 13, 0.68) 45%, rgba(11, 11, 13, 0.2) 100%),
          linear-gradient(to top, rgba(11, 11, 13, 0.7) 0%, rgba(11, 11, 13, 0) 40%);
      }
      .media-controls { right: 24px; bottom: 24px; }
      .hero-body { width: 100%; padding: 96px 0; background: none; }

      .section { padding: 88px 0; }
      .about-grid { grid-template-columns: 1fr 1.4fr; gap: 48px; }
      .about-grid h2 { margin-bottom: 0; }
      .steps { grid-template-columns: repeat(3, 1fr); }
      .steps li { flex-direction: column; }

      .site-footer { padding: 72px 0 32px; }
      .footer-grid { grid-template-columns: 1.2fr 1fr 1.2fr; gap: 48px; }
      .footer-bottom { flex-direction: row; align-items: center; justify-content: space-between; }
    }

    /* Respect reduced motion: no transitions, no smooth scrolling */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

  <!-- ==========================================================
       SHARED HEADER (same on every page)
       The logo has empty alt text because the
